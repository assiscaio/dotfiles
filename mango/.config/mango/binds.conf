# Layout set
bind=SUPER+Alt,t,setlayout,tile
bind=SUPER+Alt,h,setlayout,scroller
bind=SUPER+Alt,v,setlayout,vertical_scroller
bind=SUPER+Alt,d,setlayout,dwindle
bind=SUPER+Alt,k,setlayout,deck
bind=SUPER+Alt,f,setlayout,fair
bind=SUPER+Alt,m,setlayout,monocle
bind=SUPER+Alt,c,setlayout,center_tile
bind=SUPER+Alt,x,setlayout,vertical_tile
bind=SUPER+Alt,z,setlayout,right_tile

# Tag 0
# Toggle the special workspace overlay (Tag 0)
bind=SUPER,s,toggle_special_tag

bind=Alt,h,toggle_named_scratchpad,none,foot --app-id console_foot

# Move focused window to/from the special workspace
bind=SUPER+SHIFT,s,tag_special_tag

# Silently send active window to the special workspace without switching
bind=SUPER+CTRL,s,tag_special_silent
#Prints
bind=NONE,Print,spawn_shell,grim "$HOME/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png"
bind=CTRL,Print,spawn_shell,grim - | wl-copy
bind=ALT,Print,spawn_shell,t=$(mmsg get focusing-client | jq -r .title | sed 's#[/:]#_#g') && g=$(mmsg get focusing-client | jq -r '"\(.x),\(.y) \(.width)x\(.height)"') && grim -g "$g" "$HOME/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S)_${t:-janela}.png"
bind=CTRL+ALT,Print,spawn_shell,g=$(mmsg get focusing-client | jq -r '"\(.x),\(.y) \(.width)x\(.height)"') && grim -g "$g" - | wl-copy
bind=SUPER,Print,spawn_shell,t=$(mmsg get focusing-client | jq -r .title | sed 's#[/:]#_#g') && g=$(slurp -d) && [ -n "$g" ] && grim -g "$g" "$HOME/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S)_${t:-janela}.png"
bind=SUPER+CTRL,Print,spawn_shell,g=$(slurp -d) && [ -n "$g" ] && grim -g "$g" - | wl-copy
bind=SHIFT,Print,spawn_shell,grim - | satty --filename - --output-filename "$HOME/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png"
bind=SHIFT+ALT,Print,spawn_shell,g=$(slurp -d) && [ -n "$g" ] && grim -g "$g" - | satty --filename - --output-filename "$HOME/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png"
bind=CTRL+SHIFT,Print,spawn_shell,grim - | satty --filename - --output-filename - | wl-copy
bind=CTRL+SHIFT+ALT,Print,spawn_shell,g=$(slurp -d) && [ -n "$g" ] && grim -g "$g" - | satty --filename - --output-filename - | wl-copy



#bind=SUPER,RETURN,spawn,alacritty
bind=SUPER,RETURN,spawn,foot
bind=SUPER,Q,killclient
bind=SUPER,R,reload_config
bind=SUPER,F,togglefullscreen
bind=SUPER+SHIFT,E,quit
#bind=Alt,Space,spawn,fuzzel
bind=SUPER,space,spawn,rofi -show drun

# Foco nas janelas
bind=SUPER,H,focusdir,left
bind=SUPER,J,focusdir,down
bind=SUPER,K,focusdir,up
bind=SUPER,L,focusdir,right
# Mover janelas
bind=SUPER+SHIFT,H,move_client,left
bind=SUPER+SHIFT,J,move_client,down
bind=SUPER+SHIFT,K,move_client,up
bind=SUPER+SHIFT,L,move_client,right

#bind=SUPER,Space,togglefloating

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,togglejump,
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
#bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down
#
#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,comma,viewtoleft,0
bind=SUPER,period,viewtoright,0
bind=Alt,comma,viewtoleft_have_client,0
bind=Alt,period,viewtoright_have_client,0
bind=SUPER,Left,viewtoleft,0
bind=Alt,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=Alt,Right,viewtoright_have_client,0
bind=Alt+SUPER,comma,tagtoleft,0
bind=Alt+SUPER,period,tagtoright,0

bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0
# Move silently
bind=Alt+Shift,1,tagsilent,1,0
bind=Alt+Shift,2,tagsilent,2,0
bind=Alt+Shift,3,tagsilent,3,0
bind=Alt+Shift,4,tagsilent,4,0
bind=Alt+Shift,5,tagsilent,5,0
bind=Alt+Shift,6,tagsilent,6,0
bind=Alt+Shift,7,tagsilent,7,0
bind=Alt+Shift,8,tagsilent,8,0
bind=Alt+Shift,9,tagsilent,9,0

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

#movewin
bind=CTRL+SHIFT,k,movewin,+0,-50
bind=CTRL+SHIFT,j,movewin,+0,+50
bind=CTRL+SHIFT,h,movewin,-50,+0
bind=CTRL+SHIFT,l,movewin,+50,+0

# resizewin
bind=SUPER+CTRL,k,resizewin,+0,-100
bind=SUPER+CTRL,j,resizewin,+0,+100
bind=SUPER+CTRL,h,resizewin,-100,+0
bind=SUPER+CTRL,l,resizewin,+100,+0

# mousebinds
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
#mousebind=NONE,btn_middle,togglemaximizescreen,0

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
